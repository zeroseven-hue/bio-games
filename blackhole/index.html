<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>生物星際大逃亡：逃離黑洞 (Bio-Blackhole Escape)</title>
  <link rel="stylesheet" href="style.css?v=5.1">
</head>
<body id="gameBody">

  <!-- 🌌 動態太空 Canvas 背景 (星空速流與黑洞引力漩渦) -->
  <canvas id="spaceCanvas"></canvas>

  <!-- ⚠️ 全螢幕邊框警報閃爍 -->
  <div class="critical-alert-overlay" id="criticalAlert"></div>

  <!-- 頂部跑道與雙軌儀表板 -->
  <header id="gameHeader">
    <div class="status-row">
      <span class="badge badge-info" id="lblUnit">載入題庫中...</span>
      <span id="lblShipName">🚀 方舟號曲速逃擊中</span>
      <div class="header-tools">
        <button id="btnPause" class="btn-tool" title="教師講解暫停 (空白鍵)">⏸ 暫停</button>
        <button id="btnSound" class="btn-tool" title="音效開關">🔊 音效</button>
        <button id="btnMusic" class="btn-tool" title="背景音樂開關">🎵 音樂</button>
        <span class="badge badge-warning" id="lblOxygen">維生氧氣：100%</span>
      </div>
    </div>

    <!-- 📚 單元與進度條 -->
    <div class="unit-bar">
      <div class="unit-info" id="unitInfoText">🌱 任務單元：準備啟航</div>
      <div class="header-shields" id="lblShields">🛡️ 能量護盾：0</div>
    </div>
    
    <div class="track-container">
      <div class="track-label-row">
        <span>⚫ 黑洞引力逼近進度</span>
        <span id="lblDistance">🚀 躍遷進度: 0 / 12 題 ｜ ⚫ 黑洞安全距離: 100</span>
      </div>
      <div class="track">
        <!-- 飛船躍遷進度亮條 -->
        <div class="progress-bar" id="progressBar"></div>
        <!-- 黑洞逼近暗紅條 -->
        <div class="blackhole-bar" id="blackholeBar"></div>
        <!-- 圖示定位 -->
        <div class="ship-icon" id="shipIcon" aria-label="方舟號">
          <svg viewBox="0 0 100 60" width="66" height="40" aria-hidden="true">
            <path d="M20 24L0 30L20 36" fill="#67e8f9"/>
            <path d="M25 15L65 22L95 30L65 38L25 45L35 30Z" fill="#d7f5ff" stroke="#2983a3" stroke-width="2"/>
            <path d="M40 23L55 8L62 24M40 37L55 52L62 36" fill="#38bdf8"/>
            <ellipse cx="68" cy="30" rx="10" ry="5" fill="#155e75"/>
          </svg>
        </div>
        <div class="blackhole-icon" id="blackholeIcon" aria-label="黑洞">
          <span class="gravity-core"></span>
        </div>
      </div>
    </div>

    <!-- 臨界警報橫幅 -->
    <div class="warning-banner hidden" id="warningBanner">
      ⚠️ 警告：黑洞引力臨近！速速答對題目發動曲速推進（Warp Drive）！
    </div>
  </header>

  <!-- 飛行即時特效提示 (推進/受損/護盾) -->
  <div id="flightEffects" class="flight-effects" aria-hidden="true"></div>

  <!-- 教師空白鍵全螢幕凍結講解覆蓋層 -->
  <div id="pauseOverlay" class="pause-overlay" hidden>
    <h1>👨‍🏫 老師講解中，請看黑板</h1>
    <p>星艦推進、作答計時與星際音效已全數凍結</p>
    <button id="btnResume" class="btn-action btn-success">繼續航行 🚀</button>
  </div>

  <!-- 主答題操作區 -->
  <main id="gameMain">
    <div class="question-box" id="qText">正在連結中央生物數據庫...</div>
    <div class="options-grid">
      <button class="btn-opt opt-0" id="btn0"><span class="opt-prefix">▲</span> <span class="opt-text">選項 1</span></button>
      <button class="btn-opt opt-1" id="btn1"><span class="opt-prefix">◆</span> <span class="opt-text">選項 2</span></button>
      <button class="btn-opt opt-2" id="btn2"><span class="opt-prefix">●</span> <span class="opt-text">選項 3</span></button>
      <button class="btn-opt opt-3" id="btn3"><span class="opt-prefix">■</span> <span class="opt-text">選項 4</span></button>
    </div>
  </main>

  <!-- 完賽黑盒子觀念修復戰報底層 (在彈出三階段結算時同步備查) -->
  <div class="screen-end" id="endScreen" style="display:none;">
    <div class="end-card">
      <h1 id="endTitle" class="end-title-success">🎉 躍遷成功！成功逃離黑洞引力圈</h1>
      <div id="missionRank" class="mission-rank"></div>
      <p id="endSubtitle">逃亡任務完成！以下為本次星際答題黑盒子紀錄：</p>
      
      <div class="modal-actions-row">
        <button id="btnSubmitScoreGas" class="btn-action" style="background:linear-gradient(135deg, #0284c7, #0369a1); color:white; font-weight:800;" onclick="triggerBlackholeGasSubmit()">🚀 查看結算與交卷檢核</button>
        <button id="btnCopyCert" class="btn-action btn-gold">📋 複製學習紀錄</button>
        <button id="btnRestart" class="btn-action btn-success">🔄 再次航行</button>
      </div>

      <p id="copyStatus" role="status"></p>
      <textarea id="copyResult" class="styled-textarea" hidden readonly aria-label="學習紀錄"></textarea>

      <h2>本次優先複習的錯題觀念</h2>
      <div class="table-container">
        <table class="review-table">
          <thead>
            <tr>
              <th style="width: 45%;">題目</th>
              <th style="width: 55%;">觀念解析與正確答案</th>
            </tr>
          </thead>
          <tbody id="reviewBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 核心中介模組與遊戲邏輯 -->
  <script src="../score-submit-modal.js?v=5.1"></script>
  <script src="game.js?v=5.1"></script>
</body>
</html>
