<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⏱️ 課堂專注計時器 - bio-games</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 10px;
    }
    .top-nav {
      position: absolute;
      top: 16px;
      left: 20px;
    }
    .btn-lobby-return {
      background: rgba(255, 255, 255, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .btn-lobby-return:hover {
      background: #0284c7;
      color: #ffffff;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 92vw;
      max-width: 900px;
      padding: 30px 20px;
      border-radius: 24px;
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .task-input {
      background: transparent;
      border: none;
      border-bottom: 2px dashed #475569;
      color: #94a3b8;
      font-size: clamp(20px, 4vw, 28px);
      text-align: center;
      padding: 8px 16px;
      margin-bottom: 24px;
      width: 85%;
      outline: none;
      transition: all 0.2s;
    }
    .task-input:focus {
      border-bottom-color: #38bdf8;
      color: #f8fafc;
    }
    .timer-display {
      font-size: clamp(70px, 16vw, 150px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      line-height: 1;
      margin-bottom: 30px;
      text-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
      cursor: pointer;
    }
    .quick-tags {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .quick-tag {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: clamp(14px, 3vw, 16px);
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quick-tag:hover {
      background: #334155;
      color: #f8fafc;
    }
    .controls {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 20px;
    }
    .btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px 32px;
      font-size: clamp(18px, 4vw, 22px);
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
    }
    .btn:hover {
      background: #7dd3fc;
      transform: translateY(-2px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn-secondary {
      background: #334155;
      color: #f8fafc;
      box-shadow: none;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .sub-controls {
      display: flex;
      gap: 16px;
      align-items: center;
      color: #64748b;
      font-size: 14px;
    }
    .icon-btn {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .icon-btn:hover {
      background: #1e293b;
      color: #f8fafc;
    }
  </style>
</head>
<body>

  <div class="top-nav">
    <a href="../index.html" class="btn-lobby-return">🏠 返回生物遊戲大廳</a>
  </div>

  <div class="container" id="mainContainer">
    <input type="text" class="task-input" id="taskInput" placeholder="點擊輸入課堂活動名稱 (例: 小組生物試題討論)..." maxlength="30">
    
    <div class="timer-display" id="timerDisplay">10:00</div>

    <div class="quick-tags" id="quickTags">
      <button class="quick-tag" onclick="setTime(60)">1 分鐘</button>
      <button class="quick-tag" onclick="setTime(180)">3 分鐘</button>
      <button class="quick-tag" onclick="setTime(300)">5 分鐘</button>
      <button class="quick-tag" onclick="setTime(600)">10 分鐘</button>
      <button class="quick-tag" onclick="setTime(900)">15 分鐘</button>
      <button class="quick-tag" onclick="setTime(1200)">20 分鐘</button>
    </div>

    <div class="controls">
      <button class="btn" id="startBtn" onclick="toggleTimer()">開始</button>
      <button class="btn btn-secondary" onclick="resetTimer()">重置</button>
    </div>

    <div class="sub-controls">
      <button class="icon-btn" onclick="toggleMute()" id="soundBtn">🔊 音效: 開</button>
      <button class="icon-btn" onclick="toggleFullScreen()">⛶ 全螢幕 (F)</button>
    </div>
  </div>

  <script>
    let totalSeconds = 600;
    let remainingSeconds = 600;
    let timerId = null;
    let isRunning = false;
    let isMuted = false;

    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playBeep(freq = 600, duration = 0.1, type = 'sine') {
      if (isMuted) return;
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function playAlertTune() {
      if (isMuted) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        setTimeout(() => {
          playBeep(freq, 0.25, 'triangle');
        }, idx * 160);
      });
    }

    function formatTime(secs) {
      const m = Math.floor(secs / 60).toString().padStart(2, '0');
      const s = (secs % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateDisplay() {
      document.getElementById('timerDisplay').innerText = formatTime(remainingSeconds);
      document.title = (isRunning ? `(${formatTime(remainingSeconds)}) ` : '') + '課堂專注計時器 - bio-games';
    }

    function setTime(secs) {
      if (isRunning) pauseTimer();
      totalSeconds = secs;
      remainingSeconds = secs;
      updateDisplay();
    }

    function toggleTimer() {
      getAudioContext();
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      if (remainingSeconds <= 0) remainingSeconds = totalSeconds;
      isRunning = true;
      document.getElementById('startBtn').innerText = '暫停';
      document.getElementById('startBtn').style.background = '#f59e0b';

      clearInterval(timerId);
      timerId = setInterval(() => {
        remainingSeconds--;
        updateDisplay();

        if (remainingSeconds > 0 && remainingSeconds <= 3) {
          playBeep(440, 0.08);
        } else if (remainingSeconds <= 0) {
          pauseTimer();
          remainingSeconds = 0;
          updateDisplay();
          playAlertTune();
        }
      }, 1000);
    }

    function pauseTimer() {
      isRunning = false;
      clearInterval(timerId);
      document.getElementById('startBtn').innerText = '繼續';
      document.getElementById('startBtn').style.background = '#38bdf8';
      updateDisplay();
    }

    function resetTimer() {
      pauseTimer();
      remainingSeconds = totalSeconds;
      document.getElementById('startBtn').innerText = '開始';
      updateDisplay();
    }

    function toggleMute() {
      isMuted = !isMuted;
      document.getElementById('soundBtn').innerText = isMuted ? '🔇 音效: 關' : '🔊 音效: 開';
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn('全螢幕啟用失敗:', err);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.target.id === 'taskInput') return;
      if (e.code === 'Space') {
        e.preventDefault();
        toggleTimer();
      } else if (e.code === 'KeyR') {
        resetTimer();
      } else if (e.code === 'KeyF') {
        toggleFullScreen();
      }
    });

    updateDisplay();
  </script>
</body>
</html>
