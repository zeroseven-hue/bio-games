  <div id="game" class="game">
    <div class="shade"></div>

    <!-- 浮動展開教師面板按鈕（僅教師模式且收合時顯示） -->
    <button type="button" id="expandHomeBtn" class="expandTeacherBtn hidden teacherOnly" title="展開教師派卷與設定">⚙️ 展開教師設定 ▶</button>

    <div class="shell">
      <!-- 頂部 HUD -->
      <div id="header" class="header"></div>

      <!-- 首頁 / 左側可收合教師面板 -->
      <div id="home" class="home"></div>

      <!-- 主遊戲盤面 -->
      <div id="main" class="main hide">
        <section class="panel boardpanel">
          <div id="status" class="status"></div>
          <div id="taskHeadline" class="taskHeadline" aria-live="polite"></div>
          <div id="board" class="board"></div>
          <div class="traywrap">
            <b>🧺 羊羊暫存槽（7 格）｜三張相同且符合上方分類條件就能消除！</b>
            <div id="tray" class="tray"></div>
          </div>
        </section>
        <aside id="side" class="panel side"></aside>
      </div>
    </div>

    <!-- 右上角教師快速預覽抽屜（跳關/出題測試/快速過關） -->

      <div id="teacherPanel" class="teacherPanel hide">
        <div class="teacherPanelHeader">
          <label>👩‍🏫 教師快速預覽</label>
          <button type="button" class="btn small dark" id="closeTeacherDrawerBtn" onclick="toggleTeacher()">收合 ✕</button>
        </div>
        <div class="teacherBtns">
          <button type="button" class="btn small" onclick="startLevel(1)">第 1 關</button>
          <button type="button" class="btn small" onclick="startLevel(2)">第 2 關</button>
          <button type="button" class="btn small" onclick="startLevel(3)">第 3 關</button>
          <button type="button" class="btn small alt" onclick="teacherTestQuiz()">📖 測試題庫出題</button>
          <button type="button" class="btn small alt" onclick="teacherWin()">⚡ 模擬通關</button>
        </div>
      </div>
    </div>
