<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zootopia 大富翁抽籤系統 - 跨平台終極自適應版</title>
    <!-- 引入外部 CSS 樣式檔 -->
    <link rel="stylesheet" href="style.css">
    <!-- 引入 Excel 支援庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

    <div class="portrait-warning">👉 最佳體驗：請旋轉手機使用「橫向模式」！</div>

    <div class="board-container" id="board">
        <div class="judy-token" id="judyToken">🐰</div>
        <div class="center-area">
            <div class="mini-toggles">
                <button id="btnSound" class="toggle-btn active" onclick="toggleSound()" title="音效開關">🔊</button>
                <button id="btnTimer" class="toggle-btn active" onclick="toggleTimer()" title="計時器開關">⏱️</button>
            </div>

            <div class="center-title">動物城大富翁</div>
            <div style="margin-bottom: 15px; font-weight: bold; color: #555; font-size: clamp(12px, 1.8cqi, 20px);">Hustle! 讓茱蒂幫你選一位同學答題蓋房子</div>

            <div class="controls">
                <button class="ctrl-btn btn-dice" onclick="startDraw()" style="flex-basis: 100%;">🐰 開始抽籤！</button>
                <button class="ctrl-btn" onclick="startDraw(true)" style="background:var(--color-y)">⚡ 快速</button>
                <button class="ctrl-btn" onclick="shuffleStudents()" style="background:#90CAF9">🐾 大風吹</button>
                <button class="ctrl-btn" onclick="openRules()" style="background:#8E24AA; color:#FFF">📖 規則</button>
                <button class="ctrl-btn" onclick="openHistory()" style="background:var(--color-o)">📜 紀錄</button>
                <button class="ctrl-btn" onclick="openSettings()" style="background:#0288D1; color:#FFF">⚙️ 設定</button>
            </div>
        </div>
    </div>

    <!-- 📖 遊戲規則彈窗 -->
    <div class="modal-overlay" id="rulesModal">
        <div class="modal" style="max-width: 620px; text-align: left;">
            <div class="modal-title-bar" style="color: #2E7D32;">📖 動物城大富翁 遊戲規則</div>
            <div style="max-height: 60dvh; overflow-y: auto; padding-right: 8px; font-size: clamp(13px, 2vw, 15px); line-height: 1.6;">
                <p style="font-weight: bold; color: #0288D1; margin-top: 0;">🎯 目標：回答生物題目，建立屬於你們的生態領地！</p>
                
                <div style="background: #F1F8E9; padding: 10px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid #4CAF50;">
                    <b style="color: #2E7D32;">🎲 1. 前進與挑戰</b>
                    <div>點選中央<b>「🐰 開始抽籤」</b>，茱蒂會跳躍選出挑戰者與指定領地。</div>
                </div>

                <div style="background: #FFFDE7; padding: 10px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid #FBC02D;">
                    <b style="color: #F57F17;">🏠 2. 答題蓋建築</b>
                    <div>被抽中的同學需在時間內完成挑戰或生物題目，答對即可命名並建立該區的專屬建築標籤！</div>
                </div>

                <div style="background: #FCE4EC; padding: 10px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid #E91E63;">
                    <b style="color: #C2185B;">✨ 3. 機會與命運</b>
                    <div>踩到四個角落會觸發特殊的生態機會或考驗，隨時可能扭轉戰局！</div>
                </div>
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 15px;">
                <button class="ctrl-btn" onclick="closeRules()" style="background:#4CAF50; color:#FFF; width: 100%;">我知道了，開始挑戰！ 🚀</button>
            </div>
        </div>
    </div>

    <!-- ⚙️ 設定彈窗 -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-title-bar">⚙️ 系統設定</div>
            <div class="file-upload-box">
                <label>📁 匯入 Excel/CSV/TXT 名單</label>
                <input type="file" id="fileInput" accept=".xlsx, .xls, .csv, .txt" onchange="handleFileUpload(event)">
            </div>
            <div class="form-group"><label>1. 名單 (格式：學號,姓名)</label><textarea id="inputStudents">1,王大明
2,陳小華
3,林志明
4,張春嬌
5,李大仁</textarea></div>
            <div class="form-group"><label>2. 【✨閃亮機會】內容</label><textarea id="inputChance">下一題免答直接加1分
可以指定同學代答</textarea></div>
            <div class="form-group"><label>3. 【💢驚奇命運】內容</label><textarea id="inputDestiny">下一題只能用三個字以內回答
請大聲朗讀課本段落</textarea></div>
            <div class="form-group"><label>4. 【💡新奇題目】內容</label><textarea id="inputNovelty">大喊：我是最棒的！
跟隔壁同學擊掌</textarea></div>
            <div class="form-group"><label>5. 【🏠 建築物推薦清單】</label>
            <textarea id="inputBuildings" style="border-color:#FFCA28;">動物城警局
冰川鎮別墅
雨林區樹屋
撒哈拉度假村
草原生態園區</textarea></div>
            
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px;">
                <button class="ctrl-btn" onclick="closeSettings()">取消</button>
                <button class="ctrl-btn" onclick="applySettings()" style="background:#4CAF50; color:#FFF">套用設定</button>
            </div>
        </div>
    </div>

    <!-- 📜 歷史紀錄彈窗 -->
    <div class="modal-overlay" id="historyModal">
        <div class="modal">
            <div class="modal-title-bar">📜 歷史紀錄</div>
            <div style="max-height: max(200px, 40dvh); overflow-y: auto;">
                <table class="history-table" id="historyTable">
                    <thead><tr><th style="width:25%">時間</th><th style="width:25%">對象</th><th>詳細內容</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <div style="display:flex; gap:10px; margin-top:15px; justify-content: space-between;">
                <button class="ctrl-btn" onclick="closeHistory()" style="flex:1;">關閉</button>
                <button class="ctrl-btn" onclick="exportHistory()" style="background:#2E7D32; color:#FFF; flex:2;">📥 匯出 Excel/CSV</button>
            </div>
        </div>
    </div>

    <!-- 🎯 抽中結果彈窗 -->
    <div class="modal-overlay" id="eventModal">
        <div class="modal">
            <h2 id="eventTitle" style="font-size:clamp(22px, 5vw, 36px); color:#E74C3C; margin-top:0;">🎯 抽中了！</h2>
            <p id="eventDesc" style="font-size:clamp(16px, 3.5vw, 24px); font-weight:bold; margin: 10px 0;"></p>
            
            <div id="timerArea" class="timer-box">⏱️ <span id="timeCount">30</span> 秒</div>

            <div id="noveltyArea" style="margin-top:10px; padding:10px; background:#F1F8E9; border-radius:8px; display:none;">
                <div style="color:#2E7D32; font-size:14px;">💡 新奇挑戰：</div>
                <div id="noveltyTask" style="font-size:clamp(15px, 3vw, 18px); color:#1B5E20; font-weight:bold;"></div>
            </div>
            
            <div id="actionButtons" style="display: flex; gap: 10px; justify-content: center; margin-top:20px;"></div>
        </div>
    </div>

    <!-- 引入外部 JavaScript 邏輯檔 -->
    <script src="game.js"></script>
</body>
</html>
