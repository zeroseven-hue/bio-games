<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>生物小蜜蜂：星際防衛隊 V2.0 (Bio Defender)</title>
  <link rel="stylesheet" href="style.css?v=2.0" />
</head>
<body>

  <div id="game-container">
    <!-- 頂部 HUD 資訊列 -->
    <header>
      <div class="hud-item">❤️ <span id="lives-val">3</span></div>
      <div class="hud-item">🏆 <span id="score-val">0</span></div>
      <div class="hud-item">🔥 <span id="combo-val">0</span> 連擊</div>
      <div class="hud-item">
        <button class="btn-sound" id="sound-btn" onclick="toggleSound()">🔊 音效</button>
      </div>
    </header>

    <!-- 📚 單元切換列 (動態載入中央題庫) -->
    <div class="unit-bar">
      <span class="unit-title" id="unit-display-name">📚 載入題庫單元...</span>
      <select id="unit-select" class="styled-select" onchange="onUnitChange(this.value)">
        <option value="">載入單元中...</option>
      </select>
    </div>

    <!-- 上方生物題目閱讀板 -->
    <div id="question-panel">
      <div class="time-bar-bg">
        <div class="time-bar-fill" id="time-fill"></div>
      </div>
      <div id="q-text">戰機通訊系統連線中...</div>
      <div class="options-grid">
        <div class="opt-card A" id="opt-A">A. --</div>
        <div class="opt-card B" id="opt-B">B. --</div>
        <div class="opt-card C" id="opt-C">C. --</div>
        <div class="opt-card D" id="opt-D">D. --</div>
      </div>
    </div>

    <!-- 戰鬥主畫布 -->
    <div id="canvas-wrap">
      <canvas id="gameCanvas"></canvas>
      <div id="hint-banner"></div>
    </div>

    <!-- 教室大黑板大觸屏專用：拍打發射按鈕 -->
    <div id="bigscreen-pad" style="display: none;">
      <button class="touch-btn btn-A" onclick="directShoot('A')">[A] 鎖定發射</button>
      <button class="touch-btn btn-B" onclick="directShoot('B')">[B] 鎖定發射</button>
      <button class="touch-btn btn-C" onclick="directShoot('C')">[C] 鎖定發射</button>
      <button class="touch-btn btn-D" onclick="directShoot('D')">[D] 鎖定發射</button>
    </div>

    <!-- 彈窗 1：開局身分登錄與單元模式選擇 (防偽機制) -->
    <div class="modal-overlay" id="start-modal">
      <div class="modal-card">
        <h2 style="color: var(--accent-blue); margin-bottom: 8px;">🚀 生物星際防衛隊 V2.0</h2>
        <p style="font-size: 13px; color: #cbd5e1; margin-bottom: 10px;">
          請輸入真實身分（座號需為 2 碼如 <code style="color:var(--accent-yellow);">05</code>，姓名請填寫真實姓名，不可使用暱稱或藝名）。
        </p>
        <div style="display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap;">
          <select id="user-class" class="styled-select" style="flex: 1; min-width: 100px;">
            <option value="701">701</option><option value="702">702</option>
            <option value="703">703</option><option value="704">704</option>
            <option value="705">705</option><option value="706">706</option>
            <option value="707">707</option><option value="708">708</option>
            <option value="709">709</option><option value="710">710</option>
          </select>

          <select id="user-seat" class="styled-select" style="flex: 1; min-width: 90px;">
            <option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option>
            <option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option>
            <option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option>
            <option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option>
            <option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option>
            <option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option>
          </select>

          <input type="text" id="user-name" placeholder="真實姓名 (勿填暱稱)" style="flex: 1.5; min-width: 130px;" required />
        </div>
        <div style="font-size: 11px; color: #fbbf24; text-align: left; margin-bottom: 12px; line-height: 1.4;">
          ⚠️ 提醒：成績將自動登錄至老師雲端試算表！
        </div>

        <div style="text-align: left; margin-bottom: 12px;">
          <label style="font-size: 12px; color: #94a3b8;">選擇生物挑戰單元 (中央動態題庫)：</label>
          <select id="modal-unit-select" class="styled-select" onchange="onUnitChange(this.value)">
            <option value="">載入單元清單中...</option>
          </select>
        </div>

        <div style="text-align: left; margin-bottom: 12px;">
          <label style="font-size: 12px; color: #94a3b8;">操作模式：</label>
          <select id="mode-select">
            <option value="standard">學生載具（觸控拖曳 / 鍵盤 A/B/C/D 鍵與空白鍵）</option>
            <option value="bigscreen">教室大黑板觸控螢幕（下方直覺大按鈕）</option>
          </select>
        </div>
        <button class="primary-btn" onclick="startMission()">啟動戰機出擊！</button>
      </div>
    </div>

    <!-- 彈窗 2：結算防偽證書卡 -->
    <div class="modal-overlay" id="end-modal" style="display: none;">
      <div class="modal-card">
        <h2 style="color: var(--accent-yellow);">🎖️ 任務結算報告</h2>
        <div style="font-size: 15px; font-weight: bold; margin: 6px 0; color: #38bdf8;" id="end-rank">評級：達爾文特派員</div>

        <!-- 防偽卡片 (供學生核對) -->
        <div class="cert-card" id="cert-card">
          <div class="watermark" id="cert-watermark">701 15號 王小明</div>
          <div>👤 防衛隊員：<strong id="cert-user" style="color: var(--accent-blue);">--</strong></div>
          <div>🏆 最終戰分：<strong id="cert-score" style="color: var(--accent-green); font-size: 16px;">0</strong></div>
          <div>🎯 答對題數：<span id="cert-stats" style="color: #f8fafc;">0 / 10</span></div>
          <div>📅 完成時間：<span id="cert-time" style="color: #94a3b8;">--</span></div>
          <div>🔒 防偽序號：<code id="cert-hash" style="color: var(--accent-yellow); font-family: monospace;">--</code></div>
        </div>

        <!-- 主按鈕：一鍵傳送至試算表 (大按鈕) -->
        <button class="primary-btn" id="btnDirectSubmitGAS" onclick="directSubmitToGAS()" style="margin-top: 14px; font-size: 1.15rem; padding: 14px; background: linear-gradient(135deg, #0284c7, #0369a1); box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);">🚀 一鍵送出成績至老師試算表</button>

        <!-- 備用按鈕：複製文字 (小黃鈕) -->
        <button class="primary-btn" id="btnSubmitScoreGas" style="background:linear-gradient(135deg, #16a34a, #15803d); color:white; font-weight:800; margin-top:8px;" onclick="triggerDefenderGasSubmit()">🚀 送出成績至試算表 (優先推薦)</button>
          <button class="primary-btn btn-gold" id="btnCopyCert" onclick="copyCertText()" style="margin-top: 8px; font-size: 0.88rem; opacity: 0.85; padding: 8px;">📋 複製成績文字檔 (斷網備用)</button>

        <div style="margin-top: 12px; font-size: 12px; color: #94a3b8; text-align: left;">錯題回顧清單：</div>
        <div class="review-box" id="review-list"></div>

        <button class="primary-btn" onclick="location.reload()" style="margin-top: 10px;">重新挑戰</button>
      </div>
    </div>
  </div>

  <!-- 引入通用成績上傳模組與遊戲邏輯 -->
  <script src="../score-submit-modal.js?v=3.8"></script>
  <script src="game.js?v=3.8"></script>
</body>
</html>
